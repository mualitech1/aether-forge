security:
  # Creator authentication
  creator:
    id: "CREATOR-AF-MA-25031945-PRIME"
    verification_required: true
    multi_factor_auth: true
    session_timeout_minutes: 30
  
  # API security
  api:
    key_rotation_days: 30
    rate_limiting:
      enabled: true
      requests_per_minute: 100
    cors:
      allowed_origins:
        - "https://your-frontend-domain.com"
  
  # Data security
  data:
    encryption:
      at_rest: true
      in_transit: true
      algorithm: "AES-256-GCM"
    masking:
      sensitive_fields:
        - "api_key"
        - "password"
        - "token"
  
  # System security
  system:
    disk_scanning:
      enabled: true
      interval_hours: 24
      exclude_paths:
        - "/tmp"
        - "/var/log"
    resource_monitoring:
      enabled: true
      cpu_threshold_percent: 80
      memory_threshold_percent: 85
      disk_threshold_percent: 90
  
  # Audit logging
  audit:
    enabled: true
    retention_days: 90
    include_user_actions: true 